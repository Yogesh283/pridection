<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>WinGo 30 — Live Tip</title>
  <style>
    :root {
      --bg0: #0f1419;
      --bg1: #1a2332;
      --line: #2d3a4d;
      --text: #e8eef7;
      --muted: #8b9bb4;
      --big: #3dd68c;
      --small: #5b9fd4;
      --warn: #f0c14b;
      --num: #e8c47c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 10% -10%, #1e3a5f 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #243044 0%, transparent 50%),
        var(--bg0);
    }
    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 3rem;
    }
    h1 {
      margin: 0 0 0.35rem;
      font-size: 1.35rem;
      letter-spacing: 0.04em;
      font-weight: 650;
    }
    .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.25rem; }
    .card {
      background: color-mix(in srgb, var(--bg1) 92%, white 8%);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1.25rem 1.35rem;
      margin-bottom: 1rem;
      transition: box-shadow 0.25s ease;
    }
    .card.flash { box-shadow: 0 0 0 2px var(--big); }
    .label { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; }
    .period { font-size: 1.05rem; margin: 0.35rem 0 0.85rem; word-break: break-all; }
    .countdown {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      margin: 0.2rem 0 1rem;
      color: var(--warn);
    }
    .tip {
      border-radius: 14px;
      padding: 1.2rem 1rem;
      border: 1px solid var(--line);
      background: #121820;
      text-align: center;
    }
    .tip strong {
      display: block;
      font-size: 2.6rem;
      margin-top: 0.35rem;
      letter-spacing: 0.06em;
    }
    .BIG { color: var(--big); }
    .SMALL { color: var(--small); }
    .WAIT, .UNAVAILABLE { color: var(--warn); }
    .bars {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.55rem;
      margin-top: 0.85rem;
      text-align: left;
    }
    .bar {
      background: #0d1218;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0.55rem 0.7rem;
      font-size: 0.9rem;
    }
    .bar b { display: block; font-size: 1.15rem; margin-top: 0.15rem; }
    .meta { margin-top: 0.85rem; font-size: 0.85rem; color: var(--muted); line-height: 1.55; }
    .err { color: #ffb4b4; font-size: 0.9rem; }
    .dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--big);
      margin-right: 6px;
      animation: pulse 1.4s infinite;
    }
    .dot.dead { background: #e85d5d; animation: none; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    footer { margin-top: 1.25rem; color: var(--muted); font-size: 0.78rem; }
  </style>
</head>
<body>
  <main>
    <h1>WinGo 30 — Live Tip</h1>
    <p class="sub"><span class="dot" id="liveDot"></span><span id="liveText">Connecting…</span></p>

    <div class="card" id="box">
      <div class="label">Loading…</div>
    </div>

    <footer>
      Live tip from production model. Probability ≠ guaranteed accuracy.
    </footer>
  </main>
  <script>
    let lastKey = "";

    function roundCountdown() {
      const into = Date.now() / 1000 % 30;
      return Math.max(0, Math.ceil(30 - into));
    }

    function pct(v) {
      if (v == null || v === "") return null;
      const n = Number(v);
      if (!Number.isFinite(n)) return null;
      return Math.round((n <= 1 ? n * 100 : n));
    }

    function windowAcc(live, key) {
      const w = live && live[key];
      if (!w || typeof w !== "object") return null;
      const n = Number(w.big_small_scored ?? w.sample_size ?? 0);
      const a = w.big_small_accuracy;
      if (a == null || n < 5) return null;
      return { acc: Number(a), n };
    }

    function tipPayload(d) {
      // Supports:
      // - prediction: "BIG" | "SMALL"
      // - prediction: { big_small, number, numbers }
      // - prediction_detail: { ... }
      const detail = d.prediction_detail && typeof d.prediction_detail === "object"
        ? d.prediction_detail
        : null;
      const raw = d.prediction;
      if (typeof raw === "string") {
        return {
          big_small: raw,
          number: detail?.number ?? null,
          numbers: detail?.numbers || [],
        };
      }
      if (raw && typeof raw === "object" && !Array.isArray(raw)) {
        return {
          big_small: raw.big_small ?? detail?.big_small ?? null,
          number: raw.number ?? detail?.number ?? null,
          numbers: raw.numbers || detail?.numbers || [],
        };
      }
      return {
        big_small: detail?.big_small ?? null,
        number: detail?.number ?? null,
        numbers: detail?.numbers || [],
      };
    }

    function render(d, status) {
      const box = document.getElementById("box");
      const p = tipPayload(d);
      const conf = pct(d.confidence) ?? 0;
      const unavailable =
        d.action === "PREDICTION_UNAVAILABLE" ||
        d.status === "PREDICTION_UNAVAILABLE" ||
        String(d.decision_strategy || "").toUpperCase() === "PREDICTION_UNAVAILABLE";
      let bs = "—";
      if (unavailable) bs = "UNAVAILABLE";
      else if (d.skip || d.action === "WAIT") bs = "WAIT";
      else if (p.big_small) bs = String(p.big_small).toUpperCase();

      const num = (p.number != null && p.number !== "") ? String(p.number) : "—";
      const pBig = pct(d.probability_big ?? d.probabilities?.probability_big);
      const pSmall = pct(d.probability_small ?? d.probabilities?.probability_small);
      const tipProb = pct(d.probabilities?.big_small) ?? conf;
      const model = d.model_name || d.decision_strategy || d.strategy || "—";
      const version = d.model_version || "—";
      const trained = d.trained_on_rows ?? d.trained_rows ?? "—";
      const mstat =
        (typeof d.model_status === "string" ? d.model_status : null) ||
        d.model_status?.model_status ||
        d.model_status?.status ||
        status?.model_status?.model_status ||
        d.status ||
        "—";
      const live = d.live_accuracy || {};
      const liveBs = live.big_small_pct;
      const liveN = live.sample ?? live.big_small_scored ?? 0;
      const w10 = windowAcc(live, "last_10");
      const w25 = windowAcc(live, "last_25");
      const w50 = windowAcc(live, "last_50");
      const left = roundCountdown();
      const period = d.next_period || d.target_period || d.period || "—";
      const key = period + "|" + bs + "|" + (d.action || "");
      const changed = key && key !== lastKey;
      lastKey = key;

      box.className = "card" + (changed ? " flash" : "");
      box.innerHTML = `
        <div class="label">Result in</div>
        <div class="countdown">${left}s</div>
        <div class="label">Last settled</div>
        <div class="period" style="font-size:0.95rem;margin-bottom:0.35rem">
          ${d.current_period || "—"}
          <span class="meta"> serial <b>${d.current_serial || "—"}</b></span>
        </div>
        <div class="label">Next tip period</div>
        <div class="period">
          ${period}
          <span class="meta"> serial <b>${d.next_serial || "—"}</b></span>
        </div>
        <div class="tip">
          <div class="label">Prediction (Big / Small)</div>
          <strong class="${bs}">${bs}</strong>
          <div class="bars">
            <div class="bar">BIG<b class="BIG">${pBig != null ? pBig + "%" : "—"}</b></div>
            <div class="bar">SMALL<b class="SMALL">${pSmall != null ? pSmall + "%" : "—"}</b></div>
          </div>
          <div class="meta" style="margin-top:0.65rem">
            Tip side chance: <b>${tipProb}%</b>
            · Number: <b class="num" style="font-size:1rem">${num}</b>
          </div>
        </div>
        <div class="meta">
          Model: <b>${model}</b><br/>
          Version: <b>${version}</b> · Trained: <b>${trained}</b> · Status: <b>${mstat}</b><br/>
          Confidence: <b>${d.confidence_level || "—"}</b> (${conf}%)<br/>
          Live accuracy:
          <b>${liveBs != null && Number(liveN) >= 5 ? Number(liveBs).toFixed(1) + "%" : "n/a"}</b>
          (n=${liveN})
          ${w10 ? ` · L10 ${w10.acc.toFixed(0)}%` : ""}
          ${w25 ? ` · L25 ${w25.acc.toFixed(0)}%` : ""}
          ${w50 ? ` · L50 ${w50.acc.toFixed(0)}%` : ""}
          <br/>
          Updated: ${d.prediction_timestamp || d.generated_at || "—"}
        </div>
      `;
      if (changed) setTimeout(() => box.classList.remove("flash"), 600);

      const dot = document.getElementById("liveDot");
      const liveText = document.getElementById("liveText");
      const age = status?.server_time
        ? Math.max(0, Math.floor(Date.now() / 1000 - status.server_time))
        : (d.generated_at ? Math.max(0, Math.floor((Date.now() - Date.parse(d.generated_at)) / 1000)) : null);
      if (age != null && age < 120) {
        dot.className = "dot";
        liveText.textContent = `LIVE · ${bs} · ${model} · ${age}s ago`;
      } else {
        dot.className = "dot dead";
        liveText.textContent = age == null
          ? "Waiting for prediction.json…"
          : `Stalled (${age}s) — run: python -u main.py --live 0`;
      }
    }

    async function fetchJson(url) {
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error(url.split("?")[0] + " missing (" + res.status + ")");
      return res.json();
    }

    async function load() {
      try {
        const bust = "ts=" + Date.now();
        // Try root first, then /public/ (some hosts use public docroot).
        let d = null;
        let status = null;
        const predPaths = [
          "prediction.json?" + bust,
          "public/prediction.json?" + bust,
        ];
        let lastErr = null;
        for (const path of predPaths) {
          try {
            d = await fetchJson(path);
            break;
          } catch (e) {
            lastErr = e;
          }
        }
        if (!d) throw lastErr || new Error("prediction.json missing");

        for (const path of ["live_status.json?" + bust, "public/live_status.json?" + bust]) {
          try {
            status = await fetchJson(path);
            break;
          } catch (_) {}
        }
        // Prefer embedded prediction from live_status if fresher.
        if (status?.prediction && typeof status.prediction === "object") {
          const nest = status.prediction;
          if (nest.prediction != null || nest.prediction_detail || nest.probability_big != null) {
            d = { ...d, ...nest };
          }
        }
        render(d, status);
      } catch (e) {
        document.getElementById("box").innerHTML =
          `<div class="err">${e.message}</div>
           <div class="meta">Server path:<br/><code>/home/rmsurveyai/htdocs/rmsurveyai.com</code><br/>
           Start: <code>python -u main.py --live 0</code></div>`;
        document.getElementById("liveDot").className = "dot dead";
        document.getElementById("liveText").textContent = "Offline";
      }
    }

    load();
    setInterval(load, 1000);
  </script>
</body>
</html>
