<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>WinGo 30 — Live Tip</title>
  <style>
    :root {
      --bg0: #0f1419;
      --bg1: #1a2332;
      --line: #2d3a4d;
      --text: #e8eef7;
      --muted: #8b9bb4;
      --big: #3dd68c;
      --small: #5b9fd4;
      --warn: #f0c14b;
      --num: #e8c47c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 10% -10%, #1e3a5f 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #243044 0%, transparent 50%),
        var(--bg0);
    }
    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 3rem;
    }
    h1 {
      margin: 0 0 0.35rem;
      font-size: 1.35rem;
      letter-spacing: 0.04em;
      font-weight: 650;
    }
    .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.25rem; }
    .card {
      background: color-mix(in srgb, var(--bg1) 92%, white 8%);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1.25rem 1.35rem;
      margin-bottom: 1rem;
      transition: box-shadow 0.25s ease;
    }
    .card.flash { box-shadow: 0 0 0 2px var(--big); }
    .label { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; }
    .period { font-size: 1.05rem; margin: 0.35rem 0 0.85rem; word-break: break-all; }
    .countdown {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      margin: 0.2rem 0 1rem;
      color: var(--warn);
    }
    .tip {
      border-radius: 14px;
      padding: 1.2rem 1rem;
      border: 1px solid var(--line);
      background: #121820;
      text-align: center;
    }
    .tip strong {
      display: block;
      font-size: 2.4rem;
      margin-top: 0.35rem;
      letter-spacing: 0.06em;
    }
    .BIG { color: var(--big); }
    .SMALL { color: var(--small); }
    .num {
      color: var(--num);
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      margin: 0.15rem 0;
    }
    .alts { font-size: 0.85rem; color: var(--muted); margin-top: 0.35rem; }
    .meta { margin-top: 0.85rem; font-size: 0.85rem; color: var(--muted); line-height: 1.55; }
    .err { color: #ffb4b4; font-size: 0.9rem; }
    .dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--big);
      margin-right: 6px;
      animation: pulse 1.4s infinite;
    }
    .dot.dead { background: #e85d5d; animation: none; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    footer { margin-top: 1.25rem; color: var(--muted); font-size: 0.78rem; }
  </style>
</head>
<body>
  <main>
    <h1>WinGo 30 — Live Tip</h1>
    <p class="sub"><span class="dot" id="liveDot"></span><span id="liveText">Connecting…</span></p>

    <div class="card" id="box">
      <div class="label">Loading…</div>
    </div>

    <footer>
      Live tip authority = current production model (gradient boosting family).
      Probability is model output, not guaranteed accuracy. majority_w8 is diagnostic only.
    </footer>
  </main>
  <script>
    let lastKey = "";

    function roundCountdown() {
      const into = Date.now() / 1000 % 30;
      return Math.max(0, Math.ceil(30 - into));
    }

    function pct(v) {
      if (v == null || v === "") return null;
      const n = Number(v);
      if (!Number.isFinite(n)) return null;
      return Math.round((n <= 1 ? n * 100 : n));
    }

    function render(d, status) {
      const box = document.getElementById("box");
      const p = (typeof d.prediction === "object")
        ? (d.prediction || {})
        : (d.prediction_detail || { big_small: d.prediction });
      const conf = pct(d.confidence) ?? 0;
      const unavailable = d.action === "PREDICTION_UNAVAILABLE" || d.status === "PREDICTION_UNAVAILABLE";
      const bs = unavailable
        ? "UNAVAILABLE"
        : ((d.skip || d.action === "WAIT") ? "WAIT" : (p.big_small || "—"));
      const num = (p.number != null && p.number !== "") ? String(p.number) : "—";
      const alts = (p.numbers || []).map(x => x.number + "(" + (x.pct ?? Math.round((x.probability||0)*100)) + "%)").join(" · ");
      const pBig = pct(d.probability_big ?? d.probabilities?.probability_big);
      const pSmall = pct(d.probability_small ?? d.probabilities?.probability_small);
      const bsProb = pct(d.probabilities?.big_small) ?? conf;
      const numProb = d.probabilities?.number != null ? pct(d.probabilities.number) : null;
      const model = d.model_name || d.decision_strategy || d.strategy || "—";
      const version = d.model_version || "—";
      const trained = d.trained_on_rows ?? d.trained_rows ?? "—";
      const mstat = d.model_status?.model_status || d.model_status?.status || status?.model_status?.model_status || "—";
      const liveBs = d.live_accuracy?.big_small_pct;
      const liveN = d.live_accuracy?.sample ?? 0;
      const left = roundCountdown();
      const key = (d.next_period || d.period || "") + "|" + bs + "|" + num + "|" + (d.action || "");
      const changed = key && key !== lastKey;
      lastKey = key;

      box.className = "card" + (changed ? " flash" : "");
      box.innerHTML = `
        <div class="label">Result in</div>
        <div class="countdown">${left}s</div>
        <div class="label">Last settled</div>
        <div class="period" style="font-size:0.95rem;margin-bottom:0.35rem">
          ${d.current_period || "—"}
          <span class="meta"> serial <b>${d.current_serial || "—"}</b>
          · last# <b>${d.analysis?.last_number ?? "—"}</b></span>
        </div>
        <div class="label">Next tip</div>
        <div class="period">
          ${d.next_period || d.target_period || d.period || "—"}
          <span class="meta"> serial <b>${d.next_serial || "—"}</b></span>
        </div>
        <div class="tip">
          <div class="label">${unavailable ? "Model status" : (d.skip ? "BS weak / WAIT" : "Prediction")}</div>
          <strong class="${(bs === "BIG" || bs === "SMALL") ? bs : ""}">${bs}</strong>
          <div class="meta" style="margin-top:0.55rem">
            ${pBig != null && pSmall != null
              ? (`BIG <b>${pBig}%</b> · SMALL <b>${pSmall}%</b>`)
              : (unavailable ? (d.tip_reason || "unavailable") : (bsProb + "% tip side"))}
          </div>
          <div class="label" style="margin-top:0.7rem">Number</div>
          <div class="num">${num}</div>
          <div class="meta">${numProb != null ? ("num " + numProb + "%") : "number is secondary"}</div>
          ${alts ? `<div class="alts">Top: ${alts}</div>` : ""}
        </div>
        <div class="meta">
          Model: <b>${model}</b><br/>
          Version: <b>${version}</b> · Trained rows: <b>${trained}</b> · Status: <b>${mstat}</b><br/>
          Confidence: <b>${d.confidence_level || "—"}</b> (${conf}%)<br/>
          Live accuracy:
          <b>${liveBs != null && Number(liveN) >= 5 ? Number(liveBs).toFixed(1) + "%" : "n/a"}</b>
          <span>(resolved n=${liveN})</span><br/>
          Reason: <b>${d.tip_reason || "—"}</b><br/>
          Updated: ${d.prediction_timestamp || d.generated_at || "—"}
        </div>
      `;
      if (changed) setTimeout(() => box.classList.remove("flash"), 600);

      const dot = document.getElementById("liveDot");
      const liveText = document.getElementById("liveText");
      const age = status?.server_time
        ? Math.max(0, Math.floor(Date.now() / 1000 - status.server_time))
        : (d.generated_at ? Math.max(0, Math.floor((Date.now() - Date.parse(d.generated_at)) / 1000)) : null);
      if (age != null && age < 90) {
        dot.className = "dot";
        liveText.textContent = `LIVE · ${model} · refresh 1s · server ${age}s ago`;
      } else {
        dot.className = "dot dead";
        liveText.textContent = age == null
          ? "Waiting for live worker…"
          : `LIVE stalled (${age}s) — restart main.py --live 0`;
      }
    }

    async function load() {
      try {
        const bust = "ts=" + Date.now();
        const [predRes, statusRes] = await Promise.all([
          fetch("prediction.json?" + bust, { cache: "no-store" }),
          fetch("live_status.json?" + bust, { cache: "no-store" }).catch(() => null),
        ]);
        if (!predRes.ok) throw new Error("prediction.json missing — start auto live on server");
        const d = await predRes.json();
        let status = null;
        if (statusRes && statusRes.ok) {
          try { status = await statusRes.json(); } catch (_) {}
        }
        render(d, status);
      } catch (e) {
        document.getElementById("box").innerHTML =
          `<div class="err">${e.message}</div>
           <div class="meta">Server:<br/><code>python -u main.py --live 0</code></div>`;
        document.getElementById("liveDot").className = "dot dead";
        document.getElementById("liveText").textContent = "Offline";
      }
    }

    load();
    setInterval(load, 1000);
  </script>
</body>
</html>
